<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 620" role="img" aria-labelledby="title desc">
<title id="title">AI Business Intelligence and Priority Alert workflow</title>
<desc id="desc">Webhook data is validated, KPIs are calculated, an AI business analyst produces structured output, and deterministic priority branches send high, medium, or low Gmail alerts. Invalid data is rejected before AI processing.</desc>
<defs>
  <style>
    .bg{fill:#111315}.node{fill:#1d2022;stroke:#4b5255;stroke-width:2}.ai{fill:#20251c;stroke:#9dbb4d;stroke-width:2}.alert{fill:#202020;stroke:#6b7072;stroke-width:2}.invalid{fill:#211c1a;stroke:#8a5b4c;stroke-width:2}.txt{fill:#f2f1eb;font-family:Arial,sans-serif}.muted{fill:#9da3a5;font-family:Arial,sans-serif}.green{fill:#c7f36a}.line{stroke:#6d7578;stroke-width:3;fill:none}.branch{stroke:#c7f36a;stroke-width:3;fill:none}.bad{stroke:#8a5b4c;stroke-width:3;fill:none}
  </style>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#6d7578"/></marker>
  <marker id="greenArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c7f36a"/></marker>
  <marker id="badArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8a5b4c"/></marker>
</defs>
<rect class="bg" width="1500" height="620" rx="24"/>
<text class="muted" x="55" y="48" font-size="13" letter-spacing="2">AI BUSINESS INTELLIGENCE / PRIORITY ALERTS</text>

<rect class="node" x="55" y="130" width="170" height="78" rx="14"/><text class="txt" x="140" y="163" text-anchor="middle" font-size="18" font-weight="700">Webhook</text><text class="muted" x="140" y="188" text-anchor="middle" font-size="12">Business data</text>
<path class="line" d="M225 169 H265" marker-end="url(#arrow)"/>
<rect class="node" x="265" y="130" width="170" height="78" rx="14"/><text class="txt" x="350" y="163" text-anchor="middle" font-size="18" font-weight="700">Validate</text><text class="muted" x="350" y="188" text-anchor="middle" font-size="12">Required fields</text>
<path class="line" d="M435 169 H475" marker-end="url(#arrow)"/>
<rect class="node" x="475" y="130" width="170" height="78" rx="14"/><text class="txt" x="560" y="163" text-anchor="middle" font-size="18" font-weight="700">Calculate KPIs</text><text class="muted" x="560" y="188" text-anchor="middle" font-size="12">Pre-calculated metrics</text>
<path class="line" d="M645 169 H685" marker-end="url(#arrow)"/>
<rect class="ai" x="685" y="112" width="220" height="114" rx="16"/><text class="txt" x="795" y="151" text-anchor="middle" font-size="18" font-weight="700">AI Business Analyst</text><text class="muted" x="795" y="177" text-anchor="middle" font-size="12">Risk · opportunity · action</text><text class="green" x="795" y="201" text-anchor="middle" font-size="11">Structured output</text>
<path class="line" d="M905 169 H955" marker-end="url(#arrow)"/>
<rect class="node" x="955" y="130" width="180" height="78" rx="14"/><text class="txt" x="1045" y="163" text-anchor="middle" font-size="18" font-weight="700">Priority Router</text><text class="muted" x="1045" y="188" text-anchor="middle" font-size="12">High / Medium / Low</text>

<path class="branch" d="M1135 169 C1170 169 1170 105 1215 105" marker-end="url(#greenArrow)"/>
<path class="branch" d="M1135 169 H1215" marker-end="url(#greenArrow)"/>
<path class="branch" d="M1135 169 C1170 169 1170 233 1215 233" marker-end="url(#greenArrow)"/>

<rect class="alert" x="1215" y="66" width="225" height="78" rx="14"/><text class="txt" x="1327" y="99" text-anchor="middle" font-size="17" font-weight="700">High Priority Alert</text><text class="muted" x="1327" y="124" text-anchor="middle" font-size="12">Gmail notification</text>
<rect class="alert" x="1215" y="130" width="225" height="78" rx="14"/><text class="txt" x="1327" y="163" text-anchor="middle" font-size="17" font-weight="700">Medium Priority Alert</text><text class="muted" x="1327" y="188" text-anchor="middle" font-size="12">Gmail notification</text>
<rect class="alert" x="1215" y="194" width="225" height="78" rx="14"/><text class="txt" x="1327" y="227" text-anchor="middle" font-size="17" font-weight="700">Low Priority Alert</text><text class="muted" x="1327" y="252" text-anchor="middle" font-size="12">Gmail notification</text>

<path class="bad" d="M350 208 C350 350 300 350 300 410" marker-end="url(#badArrow)"/>
<rect class="invalid" x="190" y="410" width="220" height="78" rx="14"/><text class="txt" x="300" y="443" text-anchor="middle" font-size="17" font-weight="700">Reject Invalid Data</text><text class="muted" x="300" y="468" text-anchor="middle" font-size="12">AI is not executed</text>

<rect class="node" x="685" y="340" width="220" height="92" rx="14"/><text class="txt" x="795" y="375" text-anchor="middle" font-size="17" font-weight="700">Respond to Webhook</text><text class="muted" x="795" y="401" text-anchor="middle" font-size="12">HTTP 200 + JSON</text>
<path class="line" d="M795 226 V340" marker-end="url(#arrow)"/>

<text class="muted" x="955" y="550" font-size="12">AI interprets the supplied metrics. Workflow branches remain deterministic.</text>
</svg>